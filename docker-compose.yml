# Standalone compose for the doc-converter box (Vultr Box B).
#
# The converter runs on its own VPS, separate from the main OpenDocs stack.
# The main API box (Box A) reaches this service over Vultr's private network
# via `DOC_CONVERTER_URL=http://<Box B private IP>:8080`.
#
# Public access is blocked by binding :8080 to a private interface only — set
# VPC_BIND_IP in .env to the box's VPC IP (or 127.0.0.1 for same-host API).
# See SETUP.md for the full provisioning checklist.

services:
  converter:
    build: .
    container_name: opendocs-converter
    restart: unless-stopped
    ports:
      # Publish :8080 only on the interface named by VPC_BIND_IP (from .env).
      # Keeping the IP in .env (not in this file) means the compose config is
      # identical across boxes — only .env differs.
      - "${VPC_BIND_IP:-10.8.96.3}:8080:8080"
    environment:
      # Tuned to vCPU count — roughly 1.5x is a good starting point. Override
      # via .env to scale with the box. See .env.example for the sizing guide.
      - CONVERT_MAX_WORKERS=${CONVERT_MAX_WORKERS:-6}
    # Hard cap on container memory. `mem_limit` is respected by plain
    # `docker compose up`; the Swarm-only `deploy.resources.limits.memory` key
    # would be ignored outside a Swarm stack, so it's intentionally omitted.
    # Leave ~1 GB for host OS overhead; see .env.example for the sizing guide.
    mem_limit: ${MEMORY_LIMIT:-3G}
